[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artistly-mcp"
version = "0.1.0"
description = "Local MCP tools for Artistly image generation"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "playwright>=1.55,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[project.scripts]
artistly-mcp = "artistly_mcp.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/artistly_mcp"]
